[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name        = "deep-whisper"
version     = "0.1.0"
description = "GPU-accelerated local audio transcription pipeline with word-level timestamps"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
# IMPORTANT: faster-whisper and whisperx are in the [gpu] optional group
# rather than required dependencies. This prevents pip install from pulling
# in whisperx as a transitive dependency and overwriting ComfyUI's CUDA
# torch build with a CPU-only version.
#
# Use install.ps1 (standalone) or ComfyUI-BDC_DeepWhisper/install.py
# (ComfyUI) to install the full GPU stack with torch protection.
#
# PyTorch (torch, torchaudio) is excluded entirely — it must be installed
# separately with a CUDA-specific index URL matching the target environment.
dependencies = [
    # Voice activity detection (CPU-only, safe to install via pip)
    "silero-vad>=5.0.0",

    # Audio I/O and signal processing (CPU-only, safe to install via pip)
    "librosa>=0.10.0",
    "soundfile>=0.12.0",

    # Text normalisation (CPU-only, safe to install via pip)
    "num2words>=0.5.13",

    # Transcript reconciliation (CPU-only, safe to install via pip)
    "diff-match-patch>=20230430",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# GPU stack — install via install.ps1 or ComfyUI-BDC_DeepWhisper/install.py
# NOT via pip install deep-whisper[gpu] directly, as whisperx overwrites
# the CUDA torch build. The install scripts handle torch protection.
gpu = [
    "faster-whisper>=1.0.0",
    "whisperx>=3.0.0",
]

# Development tools
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "numpy>=1.24,<2.3",    # numba (librosa dep) requires <=2.2
]

# CUDA wheel extras — these are informational markers only (empty groups).
# Use install.ps1 to install the correct CUDA build automatically.
cu118 = []
cu121 = []
cu124 = []
cu126 = []
cu128 = []

# ---------------------------------------------------------------------------
# Console scripts
# ---------------------------------------------------------------------------
# `deep-whisper-setup` becomes available immediately after pip install and
# handles the full GPU stack installation (torch, faster-whisper, whisperx,
# cuDNN on Windows) with all known-issue mitigations built in.
[project.scripts]
deep-whisper-setup = "pipeline.setup_gpu:main"
[tool.setuptools.packages.find]
where   = ["."]
include = ["pipeline*", "comfyui_nodes*"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["tests"]
timeout    = 60
pythonpath = ["."]        # makes pipeline/ importable from tests/ without editable install

[tool.setuptools.package-data]
"*" = ["py.typed"]
